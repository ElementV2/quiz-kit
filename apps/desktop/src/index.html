<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Quizzkit — démarrage</title>
    <style>
      html, body { margin: 0; height: 100%; background: #121110; color: #ece7dc; font: 15px "Segoe UI", sans-serif; }
      body { display: grid; place-items: center; }
      p { letter-spacing: .14em; text-transform: uppercase; font-size: 12px; color: #9a9387; }
      b::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 10px; background: #e5402f; animation: blink 1s steps(2, start) infinite; }
      @keyframes blink { to { visibility: hidden; } }
    </style>
  </head>
  <body><p><b></b>Démarrage du serveur de show…</p></body>
</html>
